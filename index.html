<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Введення адреси — UEFA Champions League Style</title>
    <style>
        /* Основне тло сторінки у стилі UCL */
        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Локальне підключення вашого фону з тієї ж папки */
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Темно-синя напівпрозора форма по центру */
        .form-container {
            background: rgba(5, 13, 36, 0.75); /* Фірмовий глибокий темно-синій з напівпрозорістю */
            backdrop-filter: blur(10px); /* Ефект матового розмиття фону */
            -webkit-backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(0, 242, 254, 0.25); /* Тонка неонова рамка */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(0, 242, 254, 0.1); /* Легке неонове світіння */
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            color: #ffffff;
            position: relative;
        }

        /* Стиль заголовка форми */
        .form-container h2 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 22px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); 
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Стилі для написів (Label) */
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0; 
        }

        /* Стилі для текстових полів та списку, що випадає */
        .form-group input[type="text"], 
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* Стилізація випадаючого списку всередині */
        .form-group select option {
            background: #09132d; 
            color: #ffffff;
        }

        /* Ефект при фокусі на поля введення */
        .form-group input[type="text"]:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #00f2fe; 
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Стилізація блоку радіокнопок */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-item input[type="radio"] {
            margin-right: 8px;
            accent-color: #00f2fe; 
            cursor: pointer;
        }

        .radio-item label {
            display: inline;
            margin-bottom: 0;
            color: #ffffff;
            text-transform: none;
            letter-spacing: normal;
            font-size: 15px;
            font-weight: normal;
            cursor: pointer;
        }

        /* Преміальна кнопка у стилі трофею UCL */
        .submit-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); 
            color: #050d24; 
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
            background: linear-gradient(135deg, #00ffffff 0%, #4facfe 100%);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<!-- Локальне підключення скачаного файлу гімну з вашої папки -->
<audio id="ucl-anthem" src="anthem.mp3" preload="auto" loop></audio>

<div class="form-container">
    <h2>Введення адреси</h2>
    <form action="#" method="post" id="addressForm">
        
        <!-- Країна -->
        <div class="form-group">
            <label for="country">Країна</label>
            <select id="country" name="country">
                <option value="UA" selected>Україна</option>
                <option value="PL">Польща</option>
                <option value="DE">Німеччина</option>
                <option value="FR">Франція</option>
                <option value="ES">Іспанія</option>
            </select>
        </div>

        <!-- Поштовий індекс -->
        <div class="form-group">
            <label for="zipcode">Поштовий індекс</label>
            <input type="text" id="zipcode" name="zipcode" maxlength="6" placeholder="01001">
        </div>

        <!-- Місто -->
        <div class="form-group">
            <label for="city">Місто</label>
            <input type="text" id="city" name="city" placeholder="Введіть місто">
        </div>

        <!-- Вулиця, номер будинку -->
        <div class="form-group">
            <label for="street">Вулиця, номер будинку</label>
            <input type="text" id="street" name="street" placeholder="Вулиця, будинок, кв.">
        </div>

        <!-- Тип адреси -->
        <div class="form-group">
            <label>Тип адреси</label>
            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="home" name="address_type" value="home" checked>
                    <label for="home">Домашня</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="work" name="address_type" value="work">
                    <label for="work">Службова</label>
                </div>
            </div>
        </div>

        <!-- Кнопка відправки -->
        <button type="submit" class="submit-btn">Зберегти адресу</button>

    </form>
</div>

<script>
    const anthem = document.getElementById('ucl-anthem');
    const addressForm = document.getElementById('addressForm');
    let isPlaying = false;

    // Функція ввімкнення гімну
    function startAnthem() {
        if (!isPlaying) {
            anthem.volume = 0.4; // Помірна гучність під час заповнення
            anthem.play().then(() => {
                isPlaying = true;
            }).catch(err => {
                console.log("Браузер заблокував звук до першого кліку по елементах форми.");
            });
        }
    }

    // Слухаємо фокус та введення на всіх елементах форми (початок заповнення)
    const formElements = addressForm.querySelectorAll('input, select');
    formElements.forEach(element => {
        // Коли користувач ставить курсор або вибирає поле
        element.addEventListener('focus', startAnthem);
        // Додатково для мишки
        element.addEventListener('click', startAnthem);
        // Якщо користувач почав одразу писати за допомогою клавіатури (Tab)
        element.addEventListener('input', startAnthem);
    });

    // Кульмінація при натисканні на кнопку збереження
    addressForm.addEventListener('submit', (e) => {
        e.preventDefault(); 
        anthem.volume = 1.0; // Максимальна гучність
        if (!isPlaying) {
            anthem.play();
            isPlaying = true;
        }
        alert("The Champions! Адресу успішно збережено під офіційний гімн!");
    });
</script>

</body>
</html>
